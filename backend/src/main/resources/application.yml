server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: agro-backend

  # 1. Conexión a la base de datos (JDBC)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/agro_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123} 
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: AgroHikariCP

  # 2. Configuración JPA / Hibernate
  jpa:
    open-in-view: false
    show-sql: false 
    hibernate:     
      ddl-auto: validate 
    properties:     
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # 3. Migraciones automáticas con Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# 4. Parámetros de seguridad JWT propios de la app
jwt:
  secret: ${JWT_SECRET:f8a976c806952ca540245f93d951f52dff45886380c0be5cbf5611b7c9e8e838}
  expiration_ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas en milisegundos

# 5. Documentación Swagger / OpenAPI (Nivel raíz, fuera de 'spring')
springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-docs
    operations-sorter: method
    tags-sorter: alpha